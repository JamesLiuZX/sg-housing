<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blk block stage harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #f1ede5; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      /* The same sky as the app's, driven by the same Atmosphere. */
      .sky {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 120% 95% at 50% 42%, var(--sky-0, #faf7f1) 0%, var(--sky-1, #f1ede5) 52%, var(--sky-2, #e3ddd0) 100%);
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="stage"><div class="sky" id="sky"></div><canvas id="c"></canvas></div>
    <script type="module" src="/src/blockdev.ts"></script>
  </body>
</html>
